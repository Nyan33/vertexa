name: Build

# Every push to main builds Vertexa for Windows and publishes it as a release, the way llama.cpp does:
# the tag is bN (N = commits on main), the release is named after the commit and its notes are the commit
# message. A tag that exists already is never moved or overwritten (a re-run of the same commit skips it).
# The first release also carries CHANGELOG.md (what changed since the old Qt Vertexa). Pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all history and tags: the version and the notes come from them

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
            git

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          mkdir -p dist/Vertexa
          cp build/vertexa.exe dist/Vertexa/
          cp README.md CHANGELOG.md dist/Vertexa/
          cp LICENSE assets/cursors/LICENSE-Apache-2.0.txt dist/Vertexa/
          cd dist && zip -r Vertexa-windows-x64.zip Vertexa

      - uses: actions/upload-artifact@v4
        with:
          name: Vertexa-windows-x64
          path: dist/Vertexa-windows-x64.zip

      - name: Tag and notes
        if: github.event_name != 'pull_request'
        id: ver
        run: |
          git fetch --tags --force
          tag="b$(git rev-list --count HEAD)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          first=$(git tag -l 'b*' | head -n1)
          git log -1 --pretty=%B > notes.md
          if [ -z "$first" ]; then { echo; cat CHANGELOG.md; } >> notes.md; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$tag: $(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Release
        if: github.event_name != 'pull_request' && steps.ver.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          body_path: notes.md
          prerelease: false
          make_latest: true
          files: dist/Vertexa-windows-x64.zip
