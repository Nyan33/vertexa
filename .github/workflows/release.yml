name: Build

# Every push to main builds Vertexa for Windows and publishes it as the next version: Alpha 1, Alpha 2, ...
# (tag alpha-N, N one past the highest existing one, so no tag is ever moved or overwritten). The release
# notes are the messages of the commits since the previous version; Alpha 1 carries CHANGELOG.md (what changed since the old Qt Vertexa) and is
# updated whenever the changelog changes. Pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all history and tags: the version and the notes come from them

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
            git

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          mkdir -p dist/Vertexa
          cp build/vertexa.exe dist/Vertexa/
          cp README.md CHANGELOG.md dist/Vertexa/
          cp LICENSE assets/cursors/LICENSE-Apache-2.0.txt dist/Vertexa/
          cd dist && zip -r Vertexa-windows-x64.zip Vertexa

      - uses: actions/upload-artifact@v4
        with:
          name: Vertexa-windows-x64
          path: dist/Vertexa-windows-x64.zip

      - name: Version and notes
        if: github.event_name != 'pull_request'
        id: ver
        run: |
          git fetch --tags --force
          if [ -n "$(git tag --points-at HEAD -l 'alpha-*')" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi   # already released
          last=$(git tag -l 'alpha-*' | sed 's/alpha-//' | sort -n | tail -n1)
          n=$(( ${last:-0} + 1 ))
          if [ "$n" = 1 ]; then cp CHANGELOG.md notes.md
          else   # every commit since the previous version, each with its message
            git log --no-merges --reverse --pretty='### %s%n%n%b' "alpha-${last}..HEAD" | grep -v '^Co-Authored-By' > notes.md
          fi
          echo "tag=alpha-$n" >> "$GITHUB_OUTPUT"
          echo "name=Vertexa Alpha $n" >> "$GITHUB_OUTPUT"

      - name: Release
        if: github.event_name != 'pull_request' && steps.ver.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          body_path: notes.md
          prerelease: false
          make_latest: true
          files: dist/Vertexa-windows-x64.zip

      - name: Changelog into Alpha 1, earlier bN releases removed
        if: github.event_name != 'pull_request' && steps.ver.outputs.skip != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(git tag -l 'b*'); do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true; done
          if [ "${{ steps.ver.outputs.tag }}" != alpha-1 ] && git diff --name-only HEAD~1 HEAD | grep -qx CHANGELOG.md; then
            gh release edit alpha-1 --repo "$GITHUB_REPOSITORY" --notes-file CHANGELOG.md
          fi
